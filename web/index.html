<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DAOD — a maths tutor that talks and draws</title>
  <meta name="description" content="Ask a maths question out loud. DAOD explains it while drawing on a glass board — and you can interrupt any time.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <!-- One handwriting face (~30 KB). The board waits for it before measuring text. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <!-- Start loading every module in parallel instead of discovering them one import at a time. -->
  <link rel="modulepreload" href="/js/main.js">
  <link rel="modulepreload" href="/js/gl/scene.js">
  <link rel="modulepreload" href="/js/board/board.js">
  <link rel="modulepreload" href="/js/board/ink.js">
  <link rel="modulepreload" href="/js/board/mathtex.js">
  <link rel="modulepreload" href="/js/board/expr.js">
  <link rel="modulepreload" href="/js/tutor/conductor.js">
  <link rel="modulepreload" href="/js/tutor/voice.js">
  <link rel="modulepreload" href="/js/tutor/ears.js">
  <link rel="modulepreload" href="/js/tutor/api.js">
</head>
<body>
  <canvas id="gl" aria-label="A glass board floating in a dark room. Drag to look around, scroll to zoom, double-click to reset."></canvas>

  <header class="top">
    <div class="brand"><img src="/assets/logo.svg" alt="" width="28" height="28"><span>DAOD</span></div>
    <!-- Live readout: what the tutor is doing, and how fast it started talking. -->
    <div class="readout" id="readout" aria-live="polite"><span id="state">ready</span><span id="metric"></span></div>
    <button class="icon" id="settingsBtn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- What the tutor is saying (spoken words light up) and what you're saying. -->
  <p class="caption" id="caption" aria-live="off"></p>
  <p class="heard" id="heard" aria-live="polite"></p>

  <section class="dock" id="dock">
    <div class="pills" id="pills" aria-label="Try one">
      <button>Area of a circle</button>
      <button>Pythagoras' theorem</button>
      <button>Solve x² − x − 6 = 0</button>
      <button>Add ⅓ + ¼</button>
    </div>
    <form class="ask" id="askForm" autocomplete="off">
      <button type="button" class="mic" id="mic" aria-pressed="false" aria-label="Talk to DAOD (hands-free)" title="Hands-free: talk any time, even to interrupt">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="ring"></span><span class="ring"></span>
      </button>
      <input id="q" type="text" placeholder="Ask any maths question…" aria-label="Your question" enterkeyhint="send">
      <button type="submit" class="send" id="send">Ask</button>
    </form>
    <p class="hint" id="hint">Speak or type · <kbd>Esc</kbd> stops · interrupt any time · drag to look around</p>
  </section>

  <div class="intro" id="intro" aria-hidden="true"><div class="word"><span>D</span><span>A</span><span>O</span><span>D</span></div><p>see the maths · hear the maths</p></div>

  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <label>Voice
        <select id="engine">
          <option value="browser">Browser voice (instant)</option>
          <option value="cloud">Groq Orpheus (natural)</option>
          <option value="silent">Captions only</option>
        </select>
      </label>
      <label id="browserVoiceRow">Browser voice <select id="browserVoice"></select></label>
      <label>Speed <input id="rate" type="range" min="0.8" max="1.4" step="0.05" value="1"></label>
      <p class="small" id="modelInfo"></p>
      <button value="close">Done</button>
    </form>
  </dialog>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
